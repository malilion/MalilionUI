name: Publish

# Publish @malilion/ui to npm when a version tag (v1.2.3) is pushed.
# Uses npm Trusted Publishing (OIDC): no npm token is stored anywhere,
# and the package gets a provenance attestation linking it to this repo.
# Actions are pinned to commit SHAs (tags can be moved); the comment names the version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # lets npm verify this run via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing needs a recent npm (11.5.1+).
      - run: npm install -g npm@^11.15.0
      # Also guards manual runs: they must be started on a version tag, never a branch.
      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Ref $GITHUB_REF_NAME ($GITHUB_REF_TYPE) is not the tag $version from package.json" >&2
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs typecheck, tests and the build.
      # The trusted publisher allows direct publishing, so no manual
      # approval step is needed.
      - run: npm publish
