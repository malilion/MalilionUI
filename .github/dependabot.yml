version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # vue-tsc does not support TypeScript 6+/7 yet
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # vue-tsc 3.3.12 breaks typecheck on playground examples (toast.value)
      - dependency-name: vue-tsc
        versions: [">=3.3.12"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
